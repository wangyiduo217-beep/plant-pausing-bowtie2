[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-pausing-bowtie2"
version = "0.1.0"
description = "Reproducible Bowtie2 processing for plant GRO-seq libraries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
plant-bowtie2 = "plant_pausing_bowtie2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
